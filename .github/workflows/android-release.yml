name: Android Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Test, Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK (API 36)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck & Unit Tests
        run: |
          bun run lint
          bun run test

      - name: Build Web Bundle & Sync Capacitor
        run: |
          bun run build
          npx cap sync android

      - name: Assemble & Verify Signed Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/kadenz-release.jks
            export KEYSTORE_PATH=/tmp/kadenz-release.jks
          else
            keytool -genkeypair -v \
              -keystore /tmp/kadenz-release.jks \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias kadenz-release \
              -storepass "KadenzReleaseBuild2026!" \
              -keypass "KadenzReleaseBuild2026!" \
              -dname "CN=KADENZ OpenHealth, OU=OpenHealth, O=mixxermannipro, L=Berlin, C=DE"
            export KEYSTORE_PATH=/tmp/kadenz-release.jks
            export KEYSTORE_PASSWORD="KadenzReleaseBuild2026!"
            export KEY_ALIAS="kadenz-release"
            export KEY_PASSWORD="KadenzReleaseBuild2026!"
          fi

          ./android/gradlew -p android assembleRelease

          RAW_TAG="${GITHUB_REF_NAME:-dev}"
          TAG="${RAW_TAG//\//-}"
          mkdir -p release-out
          APK_NAME="KADENZ-OpenHealth-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release-out/${APK_NAME}"
          (cd release-out && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "release-out/${APK_NAME}"

          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(awk '{print $1}' "release-out/${APK_NAME}.sha256")" >> "$GITHUB_ENV"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kadenz-openhealth-apk
          path: release-out/*

      - name: Publish GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cat <<EOF > release-notes.md
          # KADENZ · OpenHealth ${TAG} (Android Release)

          Offizielles Android-Release von **KADENZ (OpenHealth)** – 100 % Local-First, Open Source unter **GNU AGPL-3.0**, ohne Cloud, ohne Konto und ohne Abo.

          ## ⬇️ Download & Installation auf Android
          1. Lade unten unter **Assets** die Datei **\`${APK_NAME}\`** direkt auf dein Android-Smartphone herunter (Android 8.0 / API 26 oder neuer).
          2. Tippe auf die heruntergeladene APK-Datei und erlaube bei Bedarf einmalig die Installation aus dieser Quelle.
          3. Öffne **Mehr → Datenquellen & Uhren**, verbinde **Android Health Connect** und aktiviere **Dauerhaften Hintergrund-Abgleich (15 Min.)** sowie **Akku-Optimierung deaktivieren**, damit deine Daten dauerhaft automatisch synchronisiert werden.

          ## ✨ Highlights & Native Android-Integrationen
          - **Neues modernes App-Icon**: Obsidian-Liquid-Glass-Design mit leuchtendem Vitalitäts-Ring, adaptivem Android-Icon und nativem **Android 13+ Material You Monochrome Themed Icon**.
          - **Dauerhafte 15-Minuten-Hintergrund-Synchronisation**: Echter nativer Android-\`WorkManager\`-Sync (\`READ_HEALTH_DATA_IN_BACKGROUND\`), 90-Tage-Verlauf (\`READ_HEALTH_DATA_HISTORY\`), automatischer Neustart nach Smartphone-Reboot & App-Update (\`BootCompletedReceiver\`) sowie 1-Tap-Freigabe gegen Android Doze/Akku-Drosselung.
          - **COROS-Uhr & Sportuhren (100 % kostenlos & lokal)**: Direkter COROS-Einrichtungsassistent (1-Tap *COROS App öffnen* → Health Connect), automatische Nacht-Ruhepuls-Ableitung aus der Herzfrequenz-Zeitreihe sowie nativer binärer **\`.FIT\`-, \`.GPX\`- und \`.TCX\`-Import** direkt aus der COROS-App.
          - **100 % vollständige Android Health Connect Abdeckung (alle 40 Datentypen aus Jetpack \`connect-client:1.1.0\`)**:
            - **Schlaf & Achtsamkeit**: Schlafphasen (Wach, Leicht, Tief, REM inkl. automatischer Zusammenführung geteilter Nächte) & Achtsamkeits-Sessions (\`MindfulnessSession\`)
            - **Herz & Vitalwerte**: HRV (RMSSD), Ruhepuls (+ automatische nächtliche 10.-Perzentil-Ableitung), kontinuierliche Herzfrequenz-Zeitreihen, Blutdruck (\`BloodPressure\`), Blutzucker (\`BloodGlucose\`), Blutsauerstoff (SpO₂), Atemfrequenz, Haut-, Basal- & Körpertemperatur
            - **Trainings & Aktivität**: Trainings & geplante Trainings inkl. Distanz, Höhenmeter, Stockwerke (\`FloorsClimbed\`), Geschwindigkeit/Pace (\`Speed\`), Watt-Leistung (\`Power\`), Schritt- & Trittfrequenz (\`StepsCadence\` / \`CyclingPedalingCadence\`), Schritte, Rollstuhl-Schübe, aktive & gesamte Kalorien, VO₂max
            - **Körperwerte**: Gewicht, Körpergröße (\`Height\`), Körperfett, Muskel-/Magermasse (\`LeanBodyMass\`), Knochenmasse (\`BoneMass\`), Körperwasser (\`BodyWaterMass\`) & Grundumsatz (\`BasalMetabolicRate\`)
            - **Ernährung, Flüssigkeit & Zyklus**: Wasseraufnahme (\`Hydration\`), externe Mahlzeiten (\`Nutrition\` ohne Selbst-Duplikate), Zyklus-Daten (\`Menstruation\`, \`Ovulation\`, \`CervicalMucus\`, \`IntermenstrualBleeding\`, \`SexualActivity\`) + optionaler Schreib-Abgleich zurück an Health Connect
          - **System-Komfort**: Android Share-Target (\`ACTION_SEND\`) & Deep-Links (\`caltrack://\`, \`kadenz://\`), Offline-Barcode-Scanner (\`BarcodeDetector\` + \`@zxing/browser\`), Launcher App-Shortcuts, native Haptik, \`FileProvider\` JSON-Backup, Edge-to-Edge \`WindowInsets\` & Hardware-Zurück-Navigation.

          ## 🔐 Integrität & Signatur
          - **Paketname**: \`io.github.mixxermannipro.openhealth\`
          - **Version**: \`${TAG}\`
          - **Android-Kompatibilität**: Android 8.0 (API 26) – Android 16 (API 36)
          - **Signatur**: APK Signature Scheme v2 & v3 verifiziert
          - **SHA-256**: \`${APK_SHA256}\`

          ## ⚖️ Lizenz
          Veröffentlicht unter der **GNU Affero General Public License v3.0 (GNU AGPL-3.0)**.
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "release-out/${APK_NAME}" "release-out/${APK_NAME}.sha256" --clobber
            gh release edit "${TAG}" --title "KADENZ · OpenHealth ${TAG} (Android APK)" --notes-file release-notes.md --latest
          else
            gh release create "${TAG}" \
              "release-out/${APK_NAME}" \
              "release-out/${APK_NAME}.sha256" \
              --title "KADENZ · OpenHealth ${TAG} (Android APK)" \
              --notes-file release-notes.md \
              --latest
          fi
